[package]
name = "calendar-desktop"
version = "0.1.5"
description = "A lightweight cross-platform desktop calendar"
edition = "2021"

[lib]
name = "calendar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = { version = "0.10", features = ["serde"] }
semver = "1"
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSGlassEffectView", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSFont", "NSColor", "NSStringDrawing", "NSAttributedString"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
