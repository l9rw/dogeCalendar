name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            build_bundles: nsis
            extension: exe
            updater: nsis/*-setup.exe.sig
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            build_bundles: app,dmg
            extension: dmg
            updater: macos/*.app.tar.gz*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          conf_v=$(node -e 'console.log(require("./src-tauri/tauri.conf.json").version)')
          pkg_v=$(node -e 'console.log(require("./package.json").version)')
          cargo_v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          tag_norm="$tag"
          if [[ "$tag_norm" =~ ^[0-9]+\.[0-9]+$ ]]; then tag_norm="${tag_norm}.0"; fi
          echo "cargo=$cargo_v package=$pkg_v config=$conf_v tag=$tag_norm"
          if [[ "$conf_v" != "$pkg_v" || "$conf_v" != "$cargo_v" || "$pkg_v" != "$cargo_v" ]]; then
            echo "::error::Cargo.toml, package.json and tauri.conf.json versions must all match (got cargo=$cargo_v package=$pkg_v config=$conf_v)" >&2
            exit 1
          fi
          if [[ "$tag_norm" != "$conf_v" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match app version $conf_v" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci
      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY in repository secrets' >&2; exit 1; }
      - name: Prepare macOS signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Optional developer signing/notarization. When the APPLE_CERTIFICATE
          # secret is absent, the build keeps the ad-hoc identity ("-") from
          # tauri.conf.json and must NOT be described as notarized.
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            if [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then
              echo "::error::APPLE_SIGNING_IDENTITY is required with APPLE_CERTIFICATE" >&2
              exit 1
            fi
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "macOS developer signing + notarization enabled"
            else
              echo "::warning::macOS developer signing enabled without notarization (missing APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)"
            fi
          else
            echo "macOS signing using ad-hoc identity (no APPLE_CERTIFICATE secret; build is NOT notarized)"
          fi
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.build_bundles }}
      - name: Stage release assets
        shell: bash
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }})
          updates=(src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.updater }})
          test ${#installers[@]} -eq 1 && test ${#updates[@]} -gt 0 || { echo 'Missing installer or signed updater artifacts' >&2; exit 1; }
          mkdir -p staged-assets
          cp "${installers[@]}" "${updates[@]}" staged-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dogeCalendar-${{ matrix.target }}
          path: staged-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dogeCalendar-*
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        shell: bash
        run: |
          shopt -s nullglob
          mac=(release-assets/*.app.tar.gz)
          win=(release-assets/*-setup.exe)
          test ${#mac[@]} -eq 1 && test ${#win[@]} -eq 1
          test -s "${mac[0]}.sig" && test -s "${win[0]}.sig"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg version "$version" \
            --arg mac_url "$base/$(basename "${mac[0]}")" \
            --arg mac_sig "$(cat "${mac[0]}.sig")" \
            --arg win_url "$base/$(basename "${win[0]}")" \
            --arg win_sig "$(cat "${win[0]}.sig")" \
            '{version: $version, platforms: {"darwin-aarch64": {url: $mac_url, signature: $mac_sig}, "windows-x86_64": {url: $win_url, signature: $win_sig}}}' > release-assets/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "dogeCalendar $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "dogeCalendar $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
