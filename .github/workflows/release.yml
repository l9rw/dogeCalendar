name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            updater: nsis/*-setup.exe.sig
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
            updater: macos/*.app.tar.gz*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: bash
        run: |
          node -e 'const version = require("./src-tauri/tauri.conf.json").version; const tags = [`v${version}`, `v${version.replace(/\.0$/, "")}`]; if (!tags.includes(process.env.GITHUB_REF_NAME) || require("./package.json").version !== version) { throw new Error(`Tag and app versions must match: expected ${tags.join(" or ")}`); }'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci
      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY in repository secrets' >&2; exit 1; }
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Stage release assets
        shell: bash
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }})
          updates=(src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.updater }})
          test ${#installers[@]} -eq 1 && test ${#updates[@]} -gt 0 || { echo 'Missing installer or signed updater artifacts' >&2; exit 1; }
          mkdir -p staged-assets
          cp "${installers[@]}" "${updates[@]}" staged-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dogeCalendar-${{ matrix.target }}
          path: staged-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dogeCalendar-*
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        shell: bash
        run: |
          shopt -s nullglob
          mac=(release-assets/*.app.tar.gz)
          win=(release-assets/*-setup.exe)
          test ${#mac[@]} -eq 1 && test ${#win[@]} -eq 1
          test -s "${mac[0]}.sig" && test -s "${win[0]}.sig"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg version "$version" \
            --arg mac_url "$base/$(basename "${mac[0]}")" \
            --arg mac_sig "$(cat "${mac[0]}.sig")" \
            --arg win_url "$base/$(basename "${win[0]}")" \
            --arg win_sig "$(cat "${win[0]}.sig")" \
            '{version: $version, platforms: {"darwin-aarch64": {url: $mac_url, signature: $mac_sig}, "windows-x86_64": {url: $win_url, signature: $win_sig}}}' > release-assets/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "dogeCalendar $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "dogeCalendar $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
